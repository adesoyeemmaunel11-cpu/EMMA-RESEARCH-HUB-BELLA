
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Free CBT Practice | EMMA RESEARCH HUB BELLA</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            color: #222;
        }

        .cbt-header {
            background: #111827;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .cbt-header h1 {
            font-size: 25px;
            margin-bottom: 6px;
        }

        .cbt-header p {
            color: #d1d5db;
        }

        .cbt-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 20px;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .timer {
            background: #111827;
            color: white;
            padding: 12px 20px;
            border-radius: 8px;
            font-weight: bold;
        }

        .progress {
            background: white;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
        }

        .question-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .question-number {
            color: #b8860b;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .question {
            font-size: 21px;
            font-weight: 600;
            line-height: 1.5;
            margin-bottom: 25px;
        }

        .options {
            display: grid;
            gap: 12px;
        }

        .option {
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 8px;
            cursor: pointer;
            background: #fff;
            transition: 0.2s;
        }

        .option:hover {
            background: #f3f4f6;
        }

        .option input {
            margin-right: 10px;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            gap: 10px;
        }

        button {
            border: none;
            padding: 12px 22px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: bold;
        }

        .previous {
            background: #6b7280;
            color: white;
        }

        .next {
            background: #b8860b;
            color: white;
        }

        .submit {
            background: #15803d;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .result {
            display: none;
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .result h2 {
            margin-bottom: 15px;
        }

        .score {
            font-size: 40px;
            font-weight: bold;
            margin: 20px 0;
            color: #b8860b;
        }

        .back-home {
            display: inline-block;
            margin-top: 20px;
            background: #111827;
            color: white;
            padding: 12px 22px;
            border-radius: 7px;
            text-decoration: none;
        }

        @media (max-width: 600px) {
            .cbt-container {
                padding: 12px;
            }

            .question-card {
                padding: 20px;
            }

            .question {
                font-size: 18px;
            }

            .controls {
                flex-direction: column;
            }

            .controls button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header class="cbt-header">
    <h1>EMMA RESEARCH HUB BELLA</h1>
    <p>Free CBT Practice</p>
</header>

<main class="cbt-container">

    <div id="exam-area">

        <div class="top-bar">

            <div class="progress" id="progress">
                Question 1 of 10
            </div>

            <div class="timer" id="timer">
                Time: 10:00
            </div>

        </div>

        <div class="question-card">

            <div class="question-number" id="question-number">
                QUESTION 1
            </div>

            <div class="question" id="question">
                Loading question...
            </div>

            <div class="options" id="options"></div>

            <div class="controls">

                <button
                    class="previous"
                    id="previousBtn"
                    onclick="previousQuestion()">
                    Previous
                </button>

                <button
                    class="next"
                    id="nextBtn"
                    onclick="nextQuestion()">
                    Next
                </button>

                <button
                    class="submit"
                    id="submitBtn"
                    onclick="submitExam()"
                    style="display:none;">
                    Submit Exam
                </button>

            </div>

        </div>

    </div>


    <div class="result" id="result">

        <h2>🎉 CBT Completed!</h2>

        <p>Your score is:</p>

        <div class="score" id="score">
            0 / 10
        </div>

        <p id="result-message">
            Keep learning and keep improving.
        </p>

        <a href="index.html" class="back-home">
            Back to EMMA Research Hub
        </a>

    </div>

</main>


<script>

const questions = [

    {
        question: "Which of the following is commonly used to create the structure of a webpage?",
        options: [
            "HTML",
            "CSS",
            "Python",
            "SQL"
        ],
        answer: 0
    },

    {
        question: "What does AI stand for?",
        options: [
            "Automatic Internet",
            "Artificial Intelligence",
            "Advanced Information",
            "Automated Instruction"
        ],
        answer: 1
    },

    {
        question: "Which field studies living organisms?",
        options: [
            "Physics",
            "Biology",
            "Astronomy",
            "Geology"
        ],
        answer: 1
    },

    {
        question: "What is the main purpose of education?",
        options: [
            "To stop people from asking questions",
            "To develop knowledge and skills",
            "To avoid learning",
            "To prevent research"
        ],
        answer: 1
    },

    {
        question: "Which of these is an example of a business activity?",
        options: [
            "Selling a product",
            "Sleeping",
            "Watching clouds",
            "Ignoring customers"
        ],
        answer: 0
    },

    {
        question: "Which technology is strongly associated with machine learning?",
        options: [
            "Artificial Intelligence",
            "Paper",
            "Pencil",
            "Chalk"
        ],
        answer: 0
    },

    {
        question: "Why is scientific research important?",
        options: [
            "It helps us understand and solve problems",
            "It prevents discovery",
            "It removes curiosity",
            "It stops innovation"
        ],
        answer: 0
    },

    {
        question: "Which skill can help a person succeed in technology?",
        options: [
            "Continuous learning",
            "Refusing to learn",
            "Avoiding practice",
            "Ignoring problems"
        ],
        answer: 0
    },

    {
        question: "What is entrepreneurship mainly concerned with?",
        options: [
            "Creating and developing business opportunities",
            "Avoiding all ideas",
            "Stopping innovation",
            "Ignoring customers"
        ],
        answer: 0
    },

    {
        question: "What is one important habit for successful learning?",
        options: [
            "Consistency",
            "Giving up quickly",
            "Never practicing",
            "Avoiding questions"
        ],
        answer: 0
    }

];

let currentQuestion = 0;

let userAnswers = new Array(questions.length).fill(null);

let timeLeft = 600;

let timerInterval;


function loadQuestion() {

    const q = questions[currentQuestion];

    document.getElementById("question-number").textContent =
        "QUESTION " + (currentQuestion + 1);

    document.getElementById("progress").textContent =
        "Question " + (currentQuestion + 1) +
        " of " + questions.length;

    document.getElementById("question").textContent =
        q.question;

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";

    q.options.forEach((option, index) => {

        const label = document.createElement("label");

        label.className = "option";

        label.innerHTML = `
            <input
                type="radio"
                name="answer"
                value="${index}"
                ${userAnswers[currentQuestion] === index ? "checked" : ""}
            >
            ${option}
        `;

        label.querySelector("input").addEventListener(
            "change",
            function() {
                userAnswers[currentQuestion] = index;
            }
        );

        optionsContainer.appendChild(label);

    });


    document.getElementById("previousBtn").disabled =
        currentQuestion === 0;


    if (currentQuestion === questions.length - 1) {

        document.getElementById("nextBtn").style.display = "none";

        document.getElementById("submitBtn").style.display = "inline-block";

    } else {

        document.getElementById("nextBtn").style.display = "inline-block";

        document.getElementById("submitBtn").style.display = "none";

    }

}


function nextQuestion() {

    if (currentQuestion < questions.length - 1) {

        currentQuestion++;

        loadQuestion();

    }

}


function previousQuestion() {

    if (currentQuestion > 0) {

        currentQuestion--;

        loadQuestion();

    }

}


function startTimer() {

    timerInterval = setInterval(function() {

        timeLeft--;

        const minutes =
            Math.floor(timeLeft / 60);

        const seconds =
            timeLeft % 60;

        document.getElementById("timer").textContent =
            "Time: " +
            minutes +
            ":" +
            (seconds < 10 ? "0" : "") +
            seconds;


        if (timeLeft <= 0) {

            clearInterval(timerInterval);

            submitExam();

        }

    }, 1000);

}


function submitExam() {

    clearInterval(timerInterval);

    let score = 0;

    questions.forEach((question, index) => {

        if (userAnswers[index] === question.answer) {

            score++;

        }

    });


    document.getElementById("exam-area").style.display = "none";

    document.getElementById("result").style.display = "block";

    document.getElementById("score").textContent =
        score + " / " + questions.length;


    const percentage =
        (score / questions.length) * 100;


    if (percentage >= 80) {

        document.getElementById("result-message").textContent =
            "Excellent work! Keep learning and continue your journey.";

    } else if (percentage >= 50) {

        document.getElementById("result-message").textContent =
            "Good effort! Keep practicing and you will improve.";

    } else {

        document.getElementById("result-message").textContent =
            "Keep practicing. Every attempt is a step toward improvement.";

    }

}


loadQuestion();

startTimer();

</script>

</body>
</html>
